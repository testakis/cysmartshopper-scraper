name: Cyprus Supermarket Auto Scraper

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Initialize Dynamic Scraping Dependencies
      run: npm install axios

    - name: Execute Live Multi-Source Automation Script
      env:
        ZENROWS_KEY: \${{ secrets.ZENROWS_KEY }}
      run: |
        cat << 'EOF' > run-scraper.js
        const axios = require('axios');

        const targets = [
          { name: "Lidl", url: "https://lidl.com.cy" },
          { name: "Sklavenitis", url: "https://www.sklavenitis.cy" },
          { name: "Metro", url: "https://metro.com.cy" },
          { name: "MAS", url: "https://mas.com.cy" },
          { name: "Alphamega", url: "https://alphamega.com.cy" }
        ];

        async function processPipeline() {
          const apiKey = process.env.ZENROWS_KEY;
          if (!apiKey) {
            console.error("❌ Missing structural validation secret token parameter: ZENROWS_KEY");
            return;
          }

          for (const target of targets) {
            console.log(`🤖 Requesting active proxy connection layout for target: ${target.name}...`);
            try {
              // Connect securely via ZenRows parameters framework bypass channel
              const response = await axios.get('https://zenrows.com', {
                params: {
                  'apikey': apiKey,
                  'url': target.url,
                  'antibot': 'true'
                },
                timeout: 45000
              });

              if (!response.data) {
                console.warn(`⚠️ Target destination ${target.name} returned an empty data object wrapper.`);
                continue;
              }

              // Pure Node.js Sanitization Engine: Drops code structures entirely with zero string crashes
              let cleanText = response.data
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                .replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '')
                .replace(/<[^>]*>/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

              if (cleanText.length > 20000) {
                cleanText = cleanText.substring(0, 20000);
              }

              console.log(`-> Pushing compiled content stream vector (${cleanText.length} chars) to API Endpoint...`);
              
              const injectResponse = await axios.post('https://workers.dev', {
                supermarket_name: target.name,
                content: cleanText
              }, {
                headers: { 'Content-Type': 'application/json' },
                timeout: 30000
              });

              console.log(`✅ Server Status Result for ${target.name}:`, JSON.stringify(injectResponse.data));

            } catch (error) {
              console.error(`❌ Execution failure tracked down layer inside pipeline node for ${target.name}:`, error.message);
            }
          }
        }

        processPipeline();
        EOF
        
        node run-scraper.js
