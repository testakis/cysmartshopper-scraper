name: Cyprus Supermarket Auto Scraper

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Initialize Automation Dependencies
      run: npm install axios

    - name: Execute Live Multi-Source Automation Script
      env:
        ZENROWS_KEY: \${{ secrets.ZENROWS_KEY }}
        GEMINI_KEY: \${{ secrets.GEMINI_KEY }}
      run: |
        cat << 'EOF' > run-scraper.js
        const axios = require('axios');

        const targets = [
          { name: "Lidl", url: "https://lidl.com.cy" },
          { name: "Sklavenitis", url: "https://www.sklavenitis.cy" },
          { name: "Metro", url: "https://metro.com.cy" },
          { name: "MAS", url: "https://mas.com.cy" },
          { name: "Alphamega", url: "https://alphamega.com.cy" }
        ];

        async function processPipeline() {
          const zenrowsKey = process.env.ZENROWS_KEY;
          const geminiKey = process.env.GEMINI_KEY;
          
          if (!zenrowsKey || !geminiKey) {
            console.error("❌ Λείπουν απαραίτητα κλειδιά ασφαλείας στα GitHub Secrets (ZENROWS_KEY ή GEMINI_KEY).");
            return;
          }

          for (const target of targets) {
            console.log(`🤖 1. Κατέβασμα HTML μέσω ZenRows για: ${target.name}...`);
            try {
              const response = await axios.get('https://zenrows.com', {
                params: { 'apikey': zenrowsKey, 'url': target.url, 'antibot': 'true' },
                timeout: 60000
              });

              if (!response.data) continue;

              let cleanText = response.data
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                .replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '')
                .replace(/<[^>]*>/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

              if (cleanText.length > 25000) {
                cleanText = cleanText.substring(0, 25000);
              }

              console.log(`🤖 2. Κλήση Gemini AI απευθείας από το GitHub για: ${target.name}...`);
              const geminiEndpoint = `https://googleapis.com{geminiKey}`;
              
              const geminiRes = await axios.post(geminiEndpoint, {
                contents: [{ parts: [{ text: `Analyze this Cyprus retail promotion text dataset for the brand location: ${target.name}. Extract existing items, categories, and prices. Output ONLY a clean raw JSON array data structural model format where every single child component item possesses these explicit object mapping keys: category, name, price, is_offer (1), is_leaflet (1 or 0), start_date (format template YYYY-MM-DD), end_date (format template YYYY-MM-DD). SYSTEM INSTRUCTION: If an active product item does not state an explicit promotion expiry target validation date window parameter within the text limits, you must explicitly set the end_date attribute value to null. Raw Text Data Block: ${cleanText}` }] }]
              }, { timeout: 60000 });

              // 🔧 ΔΙΟΡΘΩΣΗ: Προσθήκη [0] για σωστή ανάγνωση του πρώτου candidate από το Array
              if (geminiRes.data && geminiRes.data.candidates && geminiRes.data.candidates[0]) {
                let rawText = geminiRes.data.candidates[0].content.parts[0].text.trim();
                
                if (rawText.startsWith("```json")) rawText = rawText.replace(/```json|```/g, "").trim();
                else if (rawText.startsWith("```")) rawText = rawText.replace(/```/g, "").trim();

                const parsedProducts = JSON.parse(rawText);
                console.log(`-> 📈 Βρέθηκαν ${parsedProducts.length} live προϊόντα για το κατάστημα ${target.name}. Αποστολή στον Worker...`);

                const injectResponse = await axios.post('https://workers.dev', {
                  supermarket_name: target.name,
                  products: parsedProducts
                }, { timeout: 30000 });

                console.log(`✅ Η βάση δεδομένων D1 ενημερώθηκε επιτυχώς για ${target.name}:`, JSON.stringify(injectResponse.data));
              } else {
                console.error(`❌ Άκυρη απάντηση από το Gemini API για την υπεραγορά ${target.name}`);
              }

            } catch (error) {
              console.error(`❌ Σφάλμα στην υπεραγορά ${target.name}:`, error.message);
              if (error.response) {
                console.error("Λεπτομέρειες σφάλματος API:", JSON.stringify(error.response.data));
              }
            }
          }
        }

        processPipeline();
        EOF
        
        node run-scraper.js
