name: Cyprus Supermarket Auto Text Scraper

on:
  schedule:
    - cron: '0 */8 * * *' # Αυτόματη εκτέλεση 3 φορές τη μέρα
  workflow_dispatch:     # Σας επιτρέπει να το τρέχετε χειροκίνητα

jobs:
  automated_text_scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Axios Dependency
      run: npm install axios

    - name: Execute Live Multi-Source Automation Script
      env:
        GEMINI_KEY: \${{ secrets.GEMINI_KEY }}
      run: |
        cat << 'EOF' > text-scraper.js
        const axios = require('axios');

        const targets = [
          { name: "Lidl", url: "https://lidl.com.cy" },
          { name: "Sklavenitis", url: "https://www.sklavenitis.cy" },
          { name: "Metro", url: "https://metro.com.cy" },
          { name: "MAS", url: "https://mas.com.cy" },
          { name: "Alphamega", url: "https://alphamega.com.cy" }
        ];

        async function runAggregator() {
          const geminiKey = process.env.GEMINI_KEY;
          if (!geminiKey) {
            console.error("❌ Λείπει το GEMINI_KEY από τα GitHub Secrets.");
            return;
          }

          for (const target of targets) {
            console.log(`🤖 Ανάγνωση δεδομένων για την υπεραγορά: ${target.name}...`);
            
            try {
              const proxyUrl = `https://allorigins.win{encodeURIComponent(target.url)}`;
              const response = await axios.get(proxyUrl, {
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' },
                timeout: 30000
              });

              if (!response.data || typeof response.data !== 'string') {
                console.warn(`⚠️ Άδεια απάντηση για ${target.name}`);
                continue;
              }

              // 🔧 ΚΑΘΑΡΙΣΜΟΣ & ΜΕΤΑΤΡΟΠΗ ΣΕ BASE64 (Λύνει το πρόβλημα με τα ελληνικά και το €)
              const base64Content = Buffer.from(response.data).toString('base64');

              console.log(`🧠 Αποστολή κωδικοποιημένου payload στον Worker για AI επεξεργασία: ${target.name}...`);
              
              const injectResponse = await axios.post('https://workers.dev', {
                supermarket_name: target.name,
                base64_data: base64Content
              }, { 
                headers: { 'Content-Type': 'application/json' },
                timeout: 60000 // Δίνουμε χρόνο στον Worker να καλέσει το Gemini
              });

              console.log(`✅ Απάντηση Worker για ${target.name}:`, JSON.stringify(injectResponse.data));

            } catch (err) {
              console.error(`❌ Σφάλμα στην υπεραγορά ${target.name}:`, err.message);
            }
          }
          console.log("🏁 Η διαδικασία ολοκληρώθηκε.");
        }

        runAggregator();
        EOF
        
        node text-scraper.js
