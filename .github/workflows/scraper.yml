name: Cyprus Supermarket Auto Browser Scraper

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  automated_browser_scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment (Node 24)
      uses: actions/setup-node@v4
      with:
        node-version: 24 # 🔧 Αναβάθμιση σε Node 24 για συμβατότητα με τους νέους runners

    - name: Install Puppeteer and Axios
      run: npm install puppeteer axios

    # 🔧 Η ΛΥΣΗ: Χρήση του επίσημου εργαλείου της Google/Puppeteer που στήνει τον Chrome στο Linux αυτόματα
    - name: Setup Official Google Chrome for Puppeteer
      uses: puppeteer/puppeteer-actions/host-chrome@v1

    - name: Execute Live Multi-Source Automation Script
      env:
        GEMINI_KEY: \${{ secrets.GEMINI_KEY }}
      run: |
        cat << 'EOF' > browser-scraper.js
        const puppeteer = require('puppeteer');
        const axios = require('axios');

        const targets = [
          { name: "Lidl", url: "https://lidl.com.cy" },
          { name: "Sklavenitis", url: "https://www.sklavenitis.cy" },
          { name: "Metro", url: "https://metro.com.cy" },
          { name: "MAS", url: "https://mas.com.cy" },
          { name: "Alphamega", url: "https://alphamega.com.cy" }
        ];

        async function runAggregator() {
          const geminiKey = process.env.GEMINI_KEY;
          if (!geminiKey) {
            console.error("❌ Crucial configuration error: Missing GEMINI_KEY in GitHub Secrets.");
            return;
          }

          // 🔧 Launch Puppeteer χρησιμοποιώντας τον έτοιμο Chrome του συστήματος
          const browser = await puppeteer.launch({ 
            headless: true,
            executablePath: process.env.PUPPETEER_EXEC_PATH || null, // Χρησιμοποιεί τον έτοιμο Chrome
            args: [
              '--no-sandbox', 
              '--disable-setuid-sandbox',
              '--disable-dev-shm-usage',
              '--disable-accelerated-2d-canvas',
              '--disable-gpu'
            ]
          });

          for (const target of targets) {
            console.log(`🤖 Opening real cloud browser for: ${target.name}...`);
            const page = await browser.newPage();
            
            try {
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
              await page.setViewport({ width: 1280, height: 800 });
              
              // Φόρτωση σελίδας
              await page.goto(target.url, { waitUntil: 'networkidle2', timeout: 60000 });

              // Παίρνουμε το καθαρό κείμενο
              const visibleText = await page.evaluate(() => document.body.innerText);

              let cleanText = visibleText.replace(/\s+/g, ' ').trim();
              if (cleanText.length > 25000) {
                cleanText = cleanText.substring(0, 25000);
              }

              if (cleanText.length < 200) {
                console.warn(`⚠️ Empty content text for ${target.name}. Skipping.`);
                await page.close();
                continue;
              }

              console.log(`🧠 Processing live content dataset through Gemini AI for: ${target.name}...`);
              const geminiEndpoint = `https://googleapis.com{geminiKey}`;
              
              const geminiRes = await axios.post(geminiEndpoint, {
                contents: [{ parts: [{ text: `Analyze this Cyprus retail promotion text dataset for the brand location: ${target.name}. Extract existing items, categories, and prices. Output ONLY a clean raw JSON array data structural model format where every single child component item possesses these explicit object mapping keys: category, name, price, is_offer (1), is_leaflet (1 if from brochure, 0 otherwise), start_date (format template YYYY-MM-DD), end_date (format template YYYY-MM-DD). SYSTEM INSTRUCTION: If an active product item does not state an explicit promotion expiry target validation date window parameter within the text limits, you must explicitly set the end_date attribute value to null. Raw Text Data Block: ${cleanText}` }] }]
              }, { timeout: 45000 });

              let rawText = null;
              if (geminiRes.data && geminiRes.data.candidates && geminiRes.data.candidates.length > 0) {
                const firstCandidate = geminiRes.data.candidates[0];
                if (firstCandidate.content && firstCandidate.content.parts && firstCandidate.content.parts.length > 0) {
                  rawText = firstCandidate.content.parts[0].text.trim();
                }
              }

              if (!rawText) {
                console.error(`❌ Gemini structured response parsing failure for ${target.name}`);
                await page.close();
                continue;
              }

              if (rawText.startsWith("```json")) rawText = rawText.replace(/```json|```/g, "").trim();
              else if (rawText.startsWith("```")) rawText = rawText.replace(/```/g, "").trim();

              const parsedProducts = JSON.parse(rawText);
              console.log(`🚀 Found ${parsedProducts.length} live active items. Transmitting to Cloudflare...`);

              // Αποστολή στον Worker
              const injectResponse = await axios.post('https://workers.dev', {
                supermarket_name: target.name,
                products: parsedProducts
              }, { timeout: 15000 });

              console.log(`✅ Database D1 updated successfully for ${target.name}:`, JSON.stringify(injectResponse.data));

            } catch (err) {
              console.error(`❌ Automation pipeline failure on store node ${target.name}:`, err.message);
            } finally {
              await page.close();
            }
          }

          await browser.close();
          console.log("🏁 All Cyprus supermarket pipelines processed completely.");
        }

        runAggregator();
        EOF
        
        node browser-scraper.js
