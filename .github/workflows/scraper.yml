name: Cyprus Supermarket Auto Scraper

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Scrape Lidl and Inject
      run: |
        curl -sL "https://lidl.com.cy" > lidl.html
        jq -aRs '{supermarket_name: "Lidl", content: .}' lidl.html > payload.json
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          -d @payload.json

    - name: Scrape Sklavenitis and Inject
      run: |
        curl -sL "https://www.sklavenitis.cy" > sklavenitis.html
        jq -aRs '{supermarket_name: "Sklavenitis", content: .}' sklavenitis.html > payload.json
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          -d @payload.json

    - name: Scrape Metro and Inject
      run: |
        curl -sL "https://metro.com.cy" > metro.html
        jq -aRs '{supermarket_name: "Metro", content: .}' metro.html > payload.json
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          -d @payload.json

    - name: Scrape MAS and Inject
      run: |
        curl -sL "https://mas.com.cy" > mas.html
        jq -aRs '{supermarket_name: "MAS", content: .}' mas.html > payload.json
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          -d @payload.json

    - name: Scrape Alphamega and Inject
      run: |
        curl -sL "https://alphamega.com.cy" > alphamega.html
        jq -aRs '{supermarket_name: "Alphamega", content: .}' alphamega.html > payload.json
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          -d @payload.json
