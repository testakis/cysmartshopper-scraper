name: Cyprus Supermarket Auto Scraper

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Scrape Lidl and Inject
      run: |
        curl -sL "https://lidl.com.cy" > lidl.html
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          --data-binary "{\"supermarket_name\": \"Lidl\", \"content\": $(jq -aRs . lidl.html)}"

    - name: Scrape Sklavenitis and Inject
      run: |
        curl -sL "https://www.sklavenitis.cy" > sklavenitis.html
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          --data-binary "{\"supermarket_name\": \"Sklavenitis\", \"content\": $(jq -aRs . sklavenitis.html)}"

    - name: Scrape Metro and Inject
      run: |
        curl -sL "https://metro.com.cy" > metro.html
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          --data-binary "{\"supermarket_name\": \"Metro\", \"content\": $(jq -aRs . metro.html)}"

    - name: Scrape MAS and Inject
      run: |
        curl -sL "https://mas.com.cy" > mas.html
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          --data-binary "{\"supermarket_name\": \"MAS\", \"content\": $(jq -aRs . mas.html)}"

    - name: Scrape Alphamega and Inject
      run: |
        curl -sL "https://alphamega.com.cy" > alphamega.html
        curl -X POST "https://workers.dev" \
          -H "Content-Type: application/json" \
          --data-binary "{\"supermarket_name\": \"Alphamega\", \"content\": $(jq -aRs . alphamega.html)}"
