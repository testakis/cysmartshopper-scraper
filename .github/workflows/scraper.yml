name: Cyprus Supermarket Auto Scraper

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Scrape Lidl and Inject (ZenRows Bypass)
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%://lidl.com.cy%2Fel%2Fprosfores%2Fevdomadiaies-prosfores&antibot=true" > lidl.html
        if [ -s lidl.html ]; then
          jq -aRs '{supermarket_name: "Lidl", content: .}' lidl.html > payload.json
          curl -X POST "https://workers.dev" \
            -H "Content-Type: application/json" \
            -d @payload.json
        fi

    - name: Scrape Sklavenitis and Inject (ZenRows Bypass)
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%2Fwww.sklavenitis.cy%2Fprosfores%2Fefimerida-prosforon%2F&antibot=true" > sklavenitis.html
        if [ -s sklavenitis.html ]; then
          jq -aRs '{supermarket_name: "Sklavenitis", content: .}' sklavenitis.html > payload.json
          curl -X POST "https://workers.dev" \
            -H "Content-Type: application/json" \
            -d @payload.json
        fi

    - name: Scrape Metro and Inject (ZenRows Bypass)
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%2Fmetro.com.cy%2Fel%2Fprosfores&antibot=true" > metro.html
        if [ -s metro.html ]; then
          jq -aRs '{supermarket_name: "Metro", content: .}' metro.html > payload.json
          curl -X POST "https://workers.dev" \
            -H "Content-Type: application/json" \
            -d @payload.json
        fi

    - name: Scrape MAS and Inject (ZenRows Bypass)
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%://mas.com.cy%2Fel%2Fprosfores&antibot=true" > mas.html
        if [ -s mas.html ]; then
          jq -aRs '{supermarket_name: "MAS", content: .}' mas.html > payload.json
          curl -X POST "https://workers.dev" \
            -H "Content-Type: application/json" \
            -d @payload.json
        fi

    - name: Scrape Alphamega and Inject (ZenRows Bypass)
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%://alphamega.com.cy%2Fprosfores&antibot=true" > alphamega.html
        if [ -s alphamega.html ]; then
          jq -aRs '{supermarket_name: "Alphamega", content: .}' alphamega.html > payload.json
          curl -X POST "https://workers.dev" \
            -H "Content-Type: application/json" \
            -d @payload.json
        fi
