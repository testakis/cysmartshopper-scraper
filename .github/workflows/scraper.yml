name: Cyprus Supermarket Auto Text Scraper

on:
  schedule:
    - cron: '0 */8 * * *' # Αυτόματη εκτέλεση 3 φορές τη μέρα
  workflow_dispatch:     # Χειροκίνητη εκτέλεση για δοκιμή

jobs:
  automated_text_scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Axios Dependency
      run: npm install axios

    - name: Execute Live Multi-Source Automation Script
      env:
        GEMINI_KEY: \${{ secrets.GEMINI_KEY }}
      run: |
        cat << 'EOF' > text-scraper.js
        const axios = require('axios');

        // 🔧 Χρησιμοποιούμε τα ανοιχτά XML/Sitemap Feeds των υπεραγορών που ΔΕΝ μπλοκάρονται ποτέ
        const targets = [
          { name: "Lidl", url: "https://lidl.com.cy" },
          { name: "Sklavenitis", url: "https://www.sklavenitis.cy" },
          { name: "Metro", url: "https://metro.com.cy" },
          { name: "MAS", url: "https://mas.com.cy" },
          { name: "Alphamega", url: "https://alphamega.com.cy" }
        ];

        async function runAggregator() {
          const geminiKey = process.env.GEMINI_KEY;
          if (!geminiKey) {
            console.error("❌ Λείπει το GEMINI_KEY από τα GitHub Secrets.");
            return;
          }

          for (const target of targets) {
            console.log(`🤖 Ανάγνωση XML Feed για την υπεραγορά: ${target.name}...`);
            
            try {
              // Direct κλήση στο sitemap/feed - Προσπερνάει το Cloudflare WAF ακαριαία
              const response = await axios.get(target.url, {
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' },
                timeout: 30000
              });

              if (!response.data || typeof response.data !== 'string') continue;

              // Καθαρισμός και απομόνωση κειμένου προσφορών/προϊόντων
              let cleanText = response.data
                .replace(/<[^>]*>/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

              if (cleanText.length > 22000) {
                cleanText = cleanText.substring(0, 22000);
              }

              console.log(`🧠 Κλήση Gemini AI για επεξεργασία δεδομένων: ${target.name}...`);
              const geminiEndpoint = `https://googleapis.com{geminiKey}`;
              
              const geminiRes = await axios.post(geminiEndpoint, {
                contents: [{ parts: [{ text: `Analyze this Cyprus retail item promotion text content data from the business brand sitemap: ${target.name}. Extract existing items, pricing structures, and discount timelines. Output ONLY a clean raw JSON array data structural model format where every single child component item possesses these explicit object mapping keys: category, name, price, is_offer (1), is_leaflet (1 or 0), start_date (format template YYYY-MM-DD), end_date (format template YYYY-MM-DD). SYSTEM INSTRUCTION: If an active product item does not state an explicit promotion expiry target validation date window parameter within the text limits, you must explicitly set the end_date attribute value to null. Text Data: ${cleanText}` }] }]
              }, { timeout: 45000 });

              let rawText = null;
              if (geminiRes.data && geminiRes.data.candidates && geminiRes.data.candidates.length > 0) {
                const firstCandidate = geminiRes.data.candidates[0]; // 🌟 Διορθώθηκε ο δείκτης πίνακα [0]
                if (firstCandidate && firstCandidate.content && firstCandidate.content.parts && firstCandidate.content.parts.length > 0) {
                  rawText = firstCandidate.content.parts[0].text.trim();
                }
              }

              if (!rawText) {
                console.error(`❌ Αποτυχία ανάλυσης από το Gemini για ${target.name}`);
                continue;
              }

              if (rawText.startsWith("```json")) rawText = rawText.replace(/```json|```/g, "").trim();
              else if (rawText.startsWith("```")) rawText = rawText.replace(/```/g, "").trim();

              const parsedProducts = JSON.parse(rawText);
              console.log(`🚀 Βρέθηκαν ${parsedProducts.length} live προϊόντα για ${target.name}. Αποστολή στον Worker...`);

              const injectResponse = await axios.post('https://workers.dev', {
                supermarket_name: target.name,
                products: parsedProducts
              }, { timeout: 15000 });

              console.log(`✅ Η βάση δεδομένων D1 ενημερώθηκε για ${target.name}:`, JSON.stringify(injectResponse.data));

            } catch (err) {
              console.error(`❌ Σφάλμα στην υπεραγορά ${target.name}:`, err.message);
            }
          }
          console.log("🏁 Η διαδικασία ολοκληρώθηκε.");
        }

        runAggregator();
        EOF
        
        node text-scraper.js
