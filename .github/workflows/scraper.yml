name: Cyprus Supermarket Auto Text Scraper

on:
  schedule:
    - cron: '0 */8 * * *' # Automatically runs 3 times a day
  workflow_dispatch:     # Allows manual trigger testing anytime

jobs:
  automated_text_scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Axios Dependency
      run: npm install axios

    - name: Execute Live Multi-Source Automation Script
      env:
        GEMINI_KEY: \${{ secrets.GEMINI_KEY }}
      run: |
        cat << 'EOF' > text-scraper.js
        const axios = require('axios');

        const targets = [
          { name: "Lidl", url: "https://lidl.com.cy" },
          { name: "Sklavenitis", url: "https://www.sklavenitis.cy" },
          { name: "Metro", url: "https://metro.com.cy" },
          { name: "MAS", url: "https://mas.com.cy" },
          { name: "Alphamega", url: "https://alphamega.com.cy" }
        ];

        async function runAggregator() {
          const geminiKey = process.env.GEMINI_KEY;
          if (!geminiKey) {
            console.error("❌ Critical Validation Error: Missing GEMINI_KEY in GitHub Secrets.");
            return;
          }

          for (const target of targets) {
            console.log(`\n🤖 Processing data pipeline for: ${target.name}...`);
            
            try {
              // Extract clean HTML data text strings through AllOrigins proxy bridge layout
              const proxyUrl = `https://allorigins.win{encodeURIComponent(target.url)}`;
              const response = await axios.get(proxyUrl, {
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' },
                timeout: 30000
              });

              if (!response.data || typeof response.data !== 'string') {
                console.warn(`⚠️ Target ${target.name} returned an invalid text footprint format.`);
                continue;
              }

              // Pure JS regex layout string compilation: drops structural HTML tags safely
              let cleanText = response.data
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                .replace(/<style\b[^<]*(?:(?!<\/style>)<[^<]*)*<\/style>/gi, '')
                .replace(/<[^>]*>/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

              if (cleanText.length > 23000) {
                cleanText = cleanText.substring(0, 23000);
              }

              console.log(`🧠 Compiling raw text matrix through Gemini AI for: ${target.name}...`);
              const geminiEndpoint = `https://googleapis.com{geminiKey}`;
              
              const geminiRes = await axios.post(geminiEndpoint, {
                contents: [{ parts: [{ text: `Analyze this Cyprus retail promotion text dataset for the brand location: ${target.name}. Extract existing items, categories, and prices. Output ONLY a clean raw JSON array data structural model format where every single child component item possesses these explicit object mapping keys: category, name, price, is_offer (1), is_leaflet (1 if from brochure, 0 otherwise), start_date (format template YYYY-MM-DD), end_date (format template YYYY-MM-DD). SYSTEM INSTRUCTION: If an active product item does not state an explicit promotion expiry target validation date window parameter within the text limits, you must explicitly set the end_date attribute value to null. Raw Text Data Block: ${cleanText}` }] }]
              }, { timeout: 45000 });

              // 🔧 FIXED OBJECT POINTER PATHWAY: Explicit array index mapping rules applied
              let rawText = null;
              if (geminiRes.data && geminiRes.data.candidates && Array.isArray(geminiRes.data.candidates) && geminiRes.data.candidates.length > 0) {
                const firstCandidate = geminiRes.data.candidates[0]; // 🌟 TARGETS FIRST ARRAY COMPONENT
                if (firstCandidate && firstCandidate.content && firstCandidate.content.parts && firstCandidate.content.parts.length > 0) {
                  rawText = firstCandidate.content.parts[0].text.trim();
                }
              }

              if (!rawText) {
                console.error(`❌ Data array mapping returned null during string evaluation for ${target.name}`);
                continue;
              }

              if (rawText.startsWith("```json")) rawText = rawText.replace(/```json|```/g, "").trim();
              else if (rawText.startsWith("```")) rawText = rawText.replace(/```/g, "").trim();

              const parsedProducts = JSON.parse(rawText);
              console.log(`🚀 Successfully parsed ${parsedProducts.length} live items for ${target.name}. Sending to Cloudflare Worker...`);

              // Push payload directly down to your worker API instance
              const injectResponse = await axios.post('https://workers.dev', {
                supermarket_name: target.name,
                products: parsedProducts
              }, { timeout: 15000 });

              console.log(`✅ Database D1 updated successfully for ${target.name}:`, JSON.stringify(injectResponse.data));

            } catch (err) {
              console.error(`❌ Pipeline failure inside store data process for ${target.name}:`, err.message);
            }
          }
          console.log("\n🏁 All retail pipeline operations finalized completely.");
        }

        runAggregator();
        EOF
        
        node text-scraper.js
