name: Cyprus Supermarket Auto Scraper

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 🛒 LIDL PIPELINE
    - name: Scrape Lidl and Inject
      continue-on-error: true
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%://lidl.com.cy%2Fel%2Fprosfores%2Fevdomadiaies-prosfores&antibot=true" > raw.html
        # 🔧 Καθαρισμός HTML tags στην πηγή για μείωση μεγέθους κατά 99%
        sed -e 's/<script[^>]*>[\s\S]*?<\/script>//gi' -e 's/<style[^>]*>[\s\S]*?<\/style>//gi' -e 's/<[^>]*>/ /g' raw.html | tr -s ' ' > clean.txt
        jq -aRs '{supermarket_name: "Lidl", content: .}' clean.txt > payload.json
        curl -X POST "https://workers.dev" -H "Content-Type: application/json" -d @payload.json

    # 🛒 ΣΚΛΑΒΕΝΙΤΗΣ PIPELINE
    - name: Scrape Sklavenitis and Inject
      continue-on-error: true
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%2Fwww.sklavenitis.cy%2Fprosfores%2Fefimerida-prosforon%2F&antibot=true" > raw.html
        sed -e 's/<script[^>]*>[\s\S]*?<\/script>//gi' -e 's/<style[^>]*>[\s\S]*?<\/style>//gi' -e 's/<[^>]*>/ /g' raw.html | tr -s ' ' > clean.txt
        jq -aRs '{supermarket_name: "Sklavenitis", content: .}' clean.txt > payload.json
        curl -X POST "https://workers.dev" -H "Content-Type: application/json" -d @payload.json

    # 🛒 METRO PIPELINE
    - name: Scrape Metro and Inject
      continue-on-error: true
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%2Fmetro.com.cy%2Fel%2Fprosfores&antibot=true" > raw.html
        sed -e 's/<script[^>]*>[\s\S]*?<\/script>//gi' -e 's/<style[^>]*>[\s\S]*?<\/style>//gi' -e 's/<[^>]*>/ /g' raw.html | tr -s ' ' > clean.txt
        jq -aRs '{supermarket_name: "Metro", content: .}' clean.txt > payload.json
        curl -X POST "https://workers.dev" -H "Content-Type: application/json" -d @payload.json

    # 🛒 ΜΑΣ PIPELINE
    - name: Scrape MAS and Inject
      continue-on-error: true
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%://mas.com.cy%2Fel%2Fprosfores&antibot=true" > raw.html
        sed -e 's/<script[^>]*>[\s\S]*?<\/script>//gi' -e 's/<style[^>]*>[\s\S]*?<\/style>//gi' -e 's/<[^>]*>/ /g' raw.html | tr -s ' ' > clean.txt
        jq -aRs '{supermarket_name: "MAS", content: .}' clean.txt > payload.json
        curl -X POST "https://workers.dev" -H "Content-Type: application/json" -d @payload.json

    # 🛒 ΑΛΦΑΜΕΓΑ PIPELINE
    - name: Scrape Alphamega and Inject
      continue-on-error: true
      run: |
        curl -sL --connect-timeout 30 --retry 3 "https://zenrows.com{{ secrets.ZENROWS_KEY }}&url=https%3A%2F%://alphamega.com.cy%2Fprosfores&antibot=true" > raw.html
        sed -e 's/<script[^>]*>[\s\S]*?<\/script>//gi' -e 's/<style[^>]*>[\s\S]*?<\/style>//gi' -e 's/<[^>]*>/ /g' raw.html | tr -s ' ' > clean.txt
        jq -aRs '{supermarket_name: "Alphamega", content: .}' clean.txt > payload.json
        curl -X POST "https://workers.dev" -H "Content-Type: application/json" -d @payload.json
